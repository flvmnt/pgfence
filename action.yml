name: 'pgfence'
description: 'Postgres migration safety CLI: lock mode analysis, risk scoring, and safe rewrite recipes'
author: 'Flavius Munteanu'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path or glob to SQL migration files'
    required: true
    default: 'migrations/*.sql'
  format:
    description: 'Migration format (auto, sql, typeorm, prisma, knex, drizzle, sequelize)'
    required: false
    default: 'auto'
  max-risk:
    description: 'Maximum permitted risk level (safe, low, medium, high, critical)'
    required: false
    default: 'medium'
  db-url:
    description: 'Database URL for reading pg_stat_user_tables (size-aware risk scoring)'
    required: false
  stats-file:
    description: 'Path to db stats JSON file (alternative to db-url)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Run pgfence
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MAX_RISK: ${{ inputs.max-risk }}
        INPUT_DB_URL: ${{ inputs.db-url }}
        INPUT_STATS_FILE: ${{ inputs.stats-file }}
        PGFENCE_ACTION_PATH: ${{ github.action_path }}
      run: |
        shopt -s nullglob
        FILES=()
        while IFS= read -r file; do
          if [ -n "$file" ]; then
            FILES+=("$file")
          fi
        done < <(compgen -G "$INPUT_PATH" || true)
        if [ "${#FILES[@]}" -eq 0 ] && [ -e "$INPUT_PATH" ]; then
          FILES=("$INPUT_PATH")
        fi
        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "No files matched path: $INPUT_PATH"
          exit 1
        fi

        ARGS=("--ci" "--max-risk" "$INPUT_MAX_RISK")
        if [ "$INPUT_FORMAT" != "auto" ]; then
          ARGS+=("--format" "$INPUT_FORMAT")
        fi
        if [ -n "$INPUT_DB_URL" ]; then
          ARGS+=("--db-url" "$INPUT_DB_URL")
        fi
        if [ -n "$INPUT_STATS_FILE" ]; then
          ARGS+=("--stats-file" "$INPUT_STATS_FILE")
        fi
        ARGS+=("--" "${FILES[@]}")

        PACKAGE_VERSION=$(node -p "require(process.env.PGFENCE_ACTION_PATH + '/package.json').version")

        # pgfence 0.5.0 through 0.7.0 skip execution entirely when launched through a symlink,
        # exiting 0 with no output. npx bin entries are symlinks, so this Action was a silent
        # no-op on those versions: a green migration gate that never analyzed anything.
        # Install, then resolve to the real file before running. This stays correct once the
        # CLI guard itself is fixed, so it is safe to leave in place permanently.
        PGFENCE_HOME="$(mktemp -d)"
        npm install --prefix "$PGFENCE_HOME" --no-audit --no-fund --silent "@flvmnt/pgfence@$PACKAGE_VERSION"
        PGFENCE_ENTRY="$(node -p "require('node:fs').realpathSync(process.argv[1])" \
          "$PGFENCE_HOME/node_modules/@flvmnt/pgfence/dist/index.js")"

        PGFENCE_OUT="$(mktemp)"
        set +e
        node "$PGFENCE_ENTRY" analyze "${ARGS[@]}" | tee "$PGFENCE_OUT"
        PGFENCE_EXIT=${PIPESTATUS[0]}
        set -e

        # A safety gate that produces no output and exits 0 is indistinguishable from a pass.
        # Refuse to report success unless pgfence actually said something. This is what turns
        # the whole class of silent-skip bug into a loud failure rather than a green check.
        if [ "$PGFENCE_EXIT" -eq 0 ] && [ ! -s "$PGFENCE_OUT" ]; then
          echo "pgfence exited 0 with no output. Treating as a failure: the gate did not run." >&2
          exit 1
        fi
        exit "$PGFENCE_EXIT"
